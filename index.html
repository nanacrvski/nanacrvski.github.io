<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Regra de Três</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f6;
            color: #4a2540;
        }

        header {
            background: #f4a6c8;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-bottom: 0;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 15px;
        }

        .calculadora {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #e6b7cc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #e4b2ca;
            border-radius: 8px;
            font-size: 16px;
            background: #fffafd;
        }

        input:focus, select:focus {
            outline: 2px solid #e68ab5;
        }

        .linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grupo {
            background: #fff4f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .grupo h3 {
            margin-top: 0;
            color: #b64d83;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .calcular {
            background: #d85d98;
            color: white;
        }

        .calcular:hover {
            background: #bd477f;
        }

        .limpar {
            background: #ffe0ed;
            color: #8d3e65;
        }

        #resultado {
            display: none;
            background: #fff0f6;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        #valor {
            font-size: 28px;
            font-weight: bold;
            color: #c13e7c;
        }

        #explicacao {
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #96647c;
        }

        @media (max-width: 500px) {
            .linha {
                grid-template-columns: 1fr;
            }

            .calculadora {
                padding: 18px;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Calculadora de Regra de Três</h1>
        <p>Resolva seus cálculos de forma simples e rápida!</p>
    </header>

    <main>

        <div class="calculadora">

            <h2>Vamos calcular?</h2>

            <label for="tipo">
                Escolha o tipo de cálculo:
            </label>

            <select id="tipo" onchange="mostrarCampos()">
                <option value="simples">
                    Regra de três simples
                </option>

                <option value="composta">
                    Regra de três composta
                </option>
            </select>

            <!-- REGRA DE TRES SIMPLES -->

            <div id="simples">

                <div class="grupo">

                    <h3>Digite os valores</h3>

                    <div class="linha">

                        <div>
                            <label for="a">Primeiro valor</label>
                            <input type="number" id="a"
                                   placeholder="Ex: 2" step="any">
                        </div>

                        <div>
                            <label for="b">Segundo valor</label>
                            <input type="number" id="b"
                                   placeholder="Ex: 10" step="any">
                        </div>

                    </div>

                    <label for="c">Terceiro valor</label>
                    <input type="number" id="c"
                           placeholder="Ex: 5" step="any">

                </div>

                <label for="proporcao">
                    Tipo de proporção:
                </label>

                <select id="proporcao">

                    <option value="direta">
                        Diretamente proporcional
                    </option>

                    <option value="inversa">
                        Inversamente proporcional
                    </option>

                </select>

            </div>

            <!-- REGRA DE TRES COMPOSTA -->

            <div id="composta" style="display: none;">

                <div class="grupo">

                    <h3>Grandeza 1</h3>

                    <label for="a2">Valor conhecido</label>
                    <input type="number" id="a2"
                           placeholder="Ex: 2" step="any">

                    <label for="x2">Valor desconhecido</label>
                    <input type="text" id="x2" value="x" disabled>

                </div>

                <div class="grupo">

                    <h3>Grandeza 2</h3>

                    <div class="linha">

                        <div>
                            <label for="b2">Primeiro valor</label>
                            <input type="number" id="b2"
                                   placeholder="Ex: 100" step="any">
                        </div>

                        <div>
                            <label for="d2">Segundo valor</label>
                            <input type="number" id="d2"
                                   placeholder="Ex: 200" step="any">
                        </div>

                    </div>

                    <label for="tipo2">
                        Proporção em relação à grandeza 1:
                    </label>

                    <select id="tipo2">
                        <option value="direta">Direta</option>
                        <option value="inversa">Inversa</option>
                    </select>

                </div>

                <div class="grupo">

                    <h3>Grandeza 3</h3>

                    <div class="linha">

                        <div>
                            <label for="c2">Primeiro valor</label>
                            <input type="number" id="c2"
                                   placeholder="Ex: 5" step="any">
                        </div>

                        <div>
                            <label for="e2">Segundo valor</label>
                            <input type="number" id="e2"
                                   placeholder="Ex: 10" step="any">
                        </div>

                    </div>

                    <label for="tipo3">
                        Proporção em relação à grandeza 1:
                    </label>

                    <select id="tipo3">
                        <option value="direta">Direta</option>
                        <option value="inversa">Inversa</option>
                    </select>

                </div>

            </div>

            <button class="calcular" onclick="calcular()">
                Calcular resultado
            </button>

            <button class="limpar" onclick="limpar()">
                Limpar campos
            </button>

            <div id="resultado">

                <h3>Resultado</h3>

                <p id="valor"></p>

                <p id="explicacao"></p>

            </div>

        </div>

    </main>

    <footer>
        Calculadora de Matemática
        <br>
        Desenvolvida com HTML, CSS e JavaScript
    </footer>

    <script>

        // Mostra os campos do cálculo escolhido

        function mostrarCampos() {

            var tipo = document.getElementById("tipo").value;

            document.getElementById("simples").style.display =
                tipo == "simples" ? "block" : "none";

            document.getElementById("composta").style.display =
                tipo == "composta" ? "block" : "none";

            document.getElementById("resultado").style.display = "none";
        }


        // Verifica se os valores foram preenchidos

        function verificarCampos(ids) {

            for (var i = 0; i < ids.length; i++) {

                var campo = document.getElementById(ids[i]);

                if (campo.value.trim() == "") {
                    alert("Preencha todos os valores!");
                    campo.focus();
                    return false;
                }
            }

            return true;
        }


        // Calcula a regra de três

        function calcular() {

            var tipo = document.getElementById("tipo").value;

            var resultado;
            var formula;

            // REGRA DE TRES SIMPLES

            if (tipo == "simples") {

                if (!verificarCampos(["a", "b", "c"])) {
                    return;
                }

                var a = Number(document.getElementById("a").value);
                var b = Number(document.getElementById("b").value);
                var c = Number(document.getElementById("c").value);

                var proporcao =
                    document.getElementById("proporcao").value;

                if (proporcao == "direta") {

                    resultado = (b * c) / a;

                    formula = "x = (" + b + " × " + c +
                        ") ÷ " + a;

                } else {

                    resultado = (a * b) / c;

                    formula = "x = (" + a + " × " + b +
                        ") ÷ " + c;
                }

            }

            // REGRA DE TRES COMPOSTA

            else {

                if (!verificarCampos(["a2", "b2", "c2", "d2", "e2"])) {
                    return;
                }

                var a = Number(document.getElementById("a2").value);
                var b = Number(document.getElementById("b2").value);
                var c = Number(document.getElementById("c2").value);
                var d = Number(document.getElementById("d2").value);
                var e = Number(document.getElementById("e2").value);

                var tipo2 = document.getElementById("tipo2").value;
                var tipo3 = document.getElementById("tipo3").value;

                var parte2;
                var parte3;

                if (tipo2 == "direta") {

                    parte2 = d / b;

                } else {

                    parte2 = b / d;
                }

                if (tipo3 == "direta") {

                    parte3 = e / c;

                } else {

                    parte3 = c / e;
                }

                resultado = a * parte2 * parte3;

                formula = "x = " + a + " × " +
                    parte2.toFixed(4) + " × " +
                    parte3.toFixed(4);

            }

            // Verifica se o cálculo é válido

            if (!Number.isFinite(resultado)) {

                alert("Não é possível dividir por zero!");
                return;
            }

            // Mostra o resultado na tela

            document.getElementById("valor").textContent =
                "x = " + resultado.toLocaleString("pt-BR", {
                    maximumFractionDigits: 4
                });

            document.getElementById("explicacao").textContent =
                "Fórmula utilizada: " + formula;

            document.getElementById("resultado").style.display = "block";

        }


        // Limpa os campos

        function limpar() {

            var campos = document.querySelectorAll(
                'input[type="number"]'
            );

            for (var i = 0; i < campos.length; i++) {

                campos[i].value = "";

            }

            document.getElementById("resultado").style.display = "none";

        }

    </script>

</body>

</html>
