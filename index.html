
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 Calculadora Sakura</title>

<!-- PYTHON NO NAVEGADOR -->
<link rel="stylesheet"
href="https://pyscript.net/releases/2026.7.3/core.css">

<script type="module"
src="https://pyscript.net/releases/2026.7.3/core.js"></script>

<style>

/* FUNDO DO SITE */

body {
    font-family: Arial, sans-serif;

    background:
        radial-gradient(ellipse at 15% 20%, #ffffff 0%, transparent 35%),
        radial-gradient(ellipse at 85% 80%, #ffc9df 0%, transparent 40%),
        linear-gradient(135deg, #ffe5ef, #fff0f5, #fbd4e4);

    background-attachment: fixed;
    text-align: center;
    padding: 40px 15px;
    min-height: 100vh;
    margin: 0;
    box-sizing: border-box;
    overflow-x: hidden;
    position: relative;
}

/* FLORES DECORATIVAS */

.flower {
    position: fixed;
    font-size: 65px;
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
    animation: flutuar 5s ease-in-out infinite;
}

.flower1 {
    top: 5%;
    left: 5%;
}

.flower2 {
    top: 15%;
    right: 7%;
    font-size: 85px;
    animation-delay: 1s;
}

.flower3 {
    bottom: 8%;
    left: 8%;
    font-size: 75px;
    animation-delay: 2s;
}

.flower4 {
    bottom: 12%;
    right: 5%;
    font-size: 60px;
    animation-delay: 1.5s;
}

/* ANIMAÇÃO DAS FLORES */

@keyframes flutuar {

    0%, 100% {
        transform: translateY(0px) rotate(-5deg);
    }

    50% {
        transform: translateY(-15px) rotate(8deg);
    }

}

/* CARTÃO PRINCIPAL */

.container {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    max-width: 450px;
    margin: auto;
    padding: 30px;
    border-radius: 25px;
    border: 2px solid #ffffff;
    box-shadow: 0 10px 35px rgba(214, 51, 132, 0.15);
}

/* TÍTULO */

h1 {
    color: #d63384;
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitulo {
    color: #b76b8d;
    font-size: 14px;
    margin-bottom: 25px;
}

/* DECORAÇÃO */

.decoracao {
    color: #e78caf;
    font-size: 18px;
    margin: 15px 0;
}

/* CAMPOS E SELETORES */

input, select, button {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    border: 1px solid #f2b5cf;
    border-radius: 12px;
    box-sizing: border-box;
    font-size: 14px;
    outline: none;
}

input, select {
    background: #fff8fb;
    color: #8f4167;
    transition: 0.3s;
}

input:focus, select:focus {
    border-color: #e75480;
    box-shadow: 0 0 8px rgba(231, 84, 128, 0.2);
    background: white;
}

/* BOTÃO */

button {
    background: linear-gradient(135deg, #f28bb5, #e75480);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    margin-top: 18px;
    padding: 14px;
    box-shadow: 0 5px 12px rgba(231, 84, 128, 0.25);
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(135deg, #e75480, #c2185b);
    transform: translateY(-3px);
    box-shadow: 0 8px 15px rgba(194, 24, 91, 0.25);
}

/* RESULTADO */

#resultado {
    color: #c2185b;
    font-size: 21px;
    font-weight: bold;
    margin-top: 22px;
    padding: 15px;
    background: #fff0f6;
    border: 1px dashed #e78caf;
    border-radius: 14px;
    min-height: 25px;
}

/* ÁREAS DOS CÁLCULOS */

#simples, #composta {
    margin-top: 15px;
}

/* RODAPÉ */

.rodape {
    color: #b76b8d;
    font-size: 12px;
    margin-top: 22px;
}

/* RESPONSIVIDADE */

@media (max-width: 500px) {

    .container {
        padding: 22px;
    }

    h1 {
        font-size: 25px;
    }

    .flower {
        font-size: 40px;
    }

}

</style>

</head>

<body>

<!-- FLORES -->

<div class="flower flower1">🌸</div>
<div class="flower flower2">🌸</div>
<div class="flower flower3">🌺</div>
<div class="flower flower4">🌸</div>


<!-- CARTÃO DA CALCULADORA -->

<div class="container">

    <h1>🌸 Regra de Três</h1>

    <p class="subtitulo">
        ✿ Sua calculadora matemática kawaii ✿
    </p>

    <div class="decoracao">
        ♡ ──────── ✿ ──────── ♡
    </div>


    <!-- ESCOLHA DO CÁLCULO -->

    <select id="tipo">

        <option value="simples">
            Regra de Três Simples
        </option>

        <option value="composta">
            Regra de Três Composta
        </option>

    </select>


    <!-- REGRA DE TRÊS SIMPLES -->

    <div id="simples">

        <input type="number" id="a"
        placeholder="Valor A">

        <input type="number" id="b"
        placeholder="Valor B">

        <input type="number" id="c"
        placeholder="Valor C">

        <select id="relacao">

            <option value="direta">
                Diretamente proporcional
            </option>

            <option value="inversa">
                Inversamente proporcional
            </option>

        </select>

    </div>


    <!-- REGRA DE TRÊS COMPOSTA -->

    <div id="composta" hidden>

        <input type="number" id="x"
        placeholder="Valor inicial de X">

        <input type="number" id="g1"
        placeholder="Grandeza 1 - valor inicial">

        <input type="number" id="g2"
        placeholder="Grandeza 1 - valor final">

        <select id="r1">

            <option value="direta">
                Grandeza 1 - direta
            </option>

            <option value="inversa">
                Grandeza 1 - inversa
            </option>

        </select>

        <input type="number" id="g3"
        placeholder="Grandeza 2 - valor inicial">

        <input type="number" id="g4"
        placeholder="Grandeza 2 - valor final">

        <select id="r2">

            <option value="direta">
                Grandeza 2 - direta
            </option>

            <option value="inversa">
                Grandeza 2 - inversa
            </option>

        </select>

    </div>


    <!-- BOTÃO DE CALCULAR -->

    <button id="calcular">
        🌸 Calcular Resultado
    </button>


    <!-- RESULTADO -->

    <div id="resultado"></div>

    <div class="rodape">
        Feito com carinho ♡ Bons estudos!
    </div>

</div>


<!-- CÓDIGO PYTHON -->

<script type="py">

from pyscript import web, when
import math


# FORMATAR RESULTADO PARA O PADRÃO BRASILEIRO

def formatar_numero(numero):

    texto = f"{numero:,.4f}"

    texto = texto.rstrip("0").rstrip(".")

    texto = texto.replace(",", "X")
    texto = texto.replace(".", ",")
    texto = texto.replace("X", ".")

    return texto


# ATUALIZAR O TIPO DE CÁLCULO

@when("change", "#tipo")
def atualizar(event):

    tipo = web.page["tipo"].value

    web.page["simples"].hidden = tipo != "simples"

    web.page["composta"].hidden = tipo != "composta"

    web.page["resultado"].innerText = ""


# CALCULAR A REGRA DE TRÊS

@when("click", "#calcular")
def calcular(event):

    tipo = web.page["tipo"].value

    resultado = 0


    # REGRA DE TRÊS SIMPLES

    if tipo == "simples":

        campos = ["a", "b", "c"]

        # VERIFICAR CAMPOS VAZIOS

        for campo in campos:

            if web.page[campo].value == "":

                web.page["resultado"].innerText = (
                    "Preencha todos os valores!"
                )

                return


        # RECEBER OS VALORES

        a = float(web.page["a"].value)

        b = float(web.page["b"].value)

        c = float(web.page["c"].value)

        relacao = web.page["relacao"].value


        # VERIFICAR VALORES INVÁLIDOS

        if not all(math.isfinite(v) for v in [a, b, c]):

            web.page["resultado"].innerText = (
                "Digite valores numéricos válidos!"
            )

            return


        # DIRETAMENTE PROPORCIONAL

        if relacao == "direta":

            if a == 0:

                web.page["resultado"].innerText = (
                    "O valor A não pode ser zero!"
                )

                return

            resultado = (b * c) / a


        # INVERSAMENTE PROPORCIONAL

        else:

            if b == 0:

                web.page["resultado"].innerText = (
                    "O valor B não pode ser zero!"
                )

                return

            resultado = (a * c) / b


    # REGRA DE TRÊS COMPOSTA

    else:

        campos = ["x", "g1", "g2", "g3", "g4"]


        # VERIFICAR CAMPOS VAZIOS

        for campo in campos:

            if web.page[campo].value == "":

                web.page["resultado"].innerText = (
                    "Preencha todos os valores!"
                )

                return


        # RECEBER OS VALORES

        x = float(web.page["x"].value)

        g1 = float(web.page["g1"].value)

        g2 = float(web.page["g2"].value)

        g3 = float(web.page["g3"].value)

        g4 = float(web.page["g4"].value)


        r1 = web.page["r1"].value

        r2 = web.page["r2"].value


        # VERIFICAR VALORES INVÁLIDOS

        valores = [x, g1, g2, g3, g4]

        if not all(math.isfinite(v) for v in valores):

            web.page["resultado"].innerText = (
                "Digite valores numéricos válidos!"
            )

            return


        # VERIFICAR DIVISÕES POR ZERO

        if (
            g1 == 0
            or g3 == 0
            or (r1 == "inversa" and g2 == 0)
            or (r2 == "inversa" and g4 == 0)
        ):

            web.page["resultado"].innerText = (
                "Os valores utilizados como divisores não podem ser zero!"
            )

            return


        # COMEÇAR COM O VALOR INICIAL DE X

        resultado = x


        # PRIMEIRA GRANDEZA

        if r1 == "direta":

            resultado *= g2 / g1

        else:

            resultado *= g1 / g2


        # SEGUNDA GRANDEZA

        if r2 == "direta":

            resultado *= g4 / g3

        else:

            resultado *= g3 / g4


    # MOSTRAR O RESULTADO

    if not math.isfinite(resultado):

        web.page["resultado"].innerText = (
            "O resultado não é um número válido!"
        )

        return

    numero = formatar_numero(resultado)

    web.page["resultado"].innerText = (
        "🌸 Resultado: X = " + numero
    )

</script>

</body>

</html>
