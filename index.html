
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Regra de Três</title>

    <style>
        body {
            font-family: Arial;
            background-color: #ffe6f0;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background: #ff80ab;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #ff4f91;
        }

        h2 {
            color: #d63384;
        }

        #resultado {
            font-size: 20px;
            color: #d63384;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Calculadora de Regra de Três</h2>

    <h3>Regra de Três Simples</h3>

    <input type="number" id="a" placeholder="Valor A">
    <input type="number" id="b" placeholder="Valor B">
    <input type="number" id="c" placeholder="Valor C">

    <p>Resultado: X</p>

    <button onclick="simples()">Calcular Simples</button>

    <hr>

    <h3>Regra de Três Composta</h3>

    <p>Digite os valores conhecidos:</p>

    <input type="number" id="v1" placeholder="Valor 1">
    <input type="number" id="v2" placeholder="Valor 2">
    <input type="number" id="v3" placeholder="Valor 3">
    <input type="number" id="v4" placeholder="Valor 4">
    <input type="number" id="v5" placeholder="Valor 5">

    <button onclick="composta()">Calcular Composta</button>

    <p id="resultado"></p>

    <button onclick="limpar()">Limpar</button>

</div>

<script>

function simples() {

    let a = Number(document.getElementById("a").value);
    let b = Number(document.getElementById("b").value);
    let c = Number(document.getElementById("c").value);

    if (a === 0 || !a || !b || !c) {
        alert("Preencha os valores corretamente!");
        return;
    }

    let x = (b * c) / a;

    document.getElementById("resultado").innerHTML =
        "Resultado: " + x;
}

function composta() {

    let v1 = Number(document.getElementById("v1").value);
    let v2 = Number(document.getElementById("v2").value);
    let v3 = Number(document.getElementById("v3").value);
    let v4 = Number(document.getElementById("v4").value);
    let v5 = Number(document.getElementById("v5").value);

    if (!v1 || !v2 || !v3 || !v4 || !v5) {
        alert("Preencha todos os valores!");
        return;
    }

    let x = (v2 * v4 * v5) / (v1 * v3);

    document.getElementById("resultado").innerHTML =
        "Resultado: " + x;
}

function limpar() {

    document.querySelectorAll("input").forEach(campo => {
        campo.value = "";
    });

    document.getElementById("resultado").innerHTML = "";
}

</script>

</body>
</html>
