
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Rosa | Regra de Três</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#fff5f9,#f8dce9);
 color:#583b4a;
}
main{
 max-width:750px;margin:30px auto;
 background:white;padding:28px;
 border-radius:22px;
 box-shadow:0 8px 30px #bd79952b;
 border:1px solid #f4d2e1;
}
header{text-align:center;margin-bottom:25px}
h1{color:#c65e8b;margin-bottom:8px}
header p{color:#927484}
.tabs{display:flex;gap:10px;margin-bottom:25px}
button{
 border:0;border-radius:10px;padding:13px;
 cursor:pointer;font-weight:bold;
}
.tabs button{flex:1;background:#fce8f1;color:#ad5077}
.tabs button.active,.calculate{
 background:#d66e9a;color:white
}
h2{color:#bd5c86;font-size:20px}
label{display:block;font-weight:bold;font-size:13px;margin:13px 0 6px}
input,select{
 width:100%;padding:12px;border:1px solid #edc9d9;
 border-radius:9px;background:#fffafd;color:#583b4a;
 font-size:15px;
}
input:focus,select:focus{outline:2px solid #efb8d0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{display:none}
.panel.active{display:block}
.calculate{width:100%;margin-top:20px}
.secondary{background:#fce8f1;color:#ad5077;margin-top:12px}
.result{
 display:none;background:#fff2f7;border:1px solid #edc9d9;
 padding:18px;border-radius:12px;margin-top:20px;
 white-space:pre-line;line-height:1.7;
}
.result strong{font-size:27px;color:#bd5080}
.error{color:#b52c55;margin-top:12px}
.magnitude{
 padding:15px;background:#fff7fa;
 border:1px solid #f0d5e1;border-radius:12px;
 margin-top:15px;
}
.magnitude h3{font-size:15px;color:#bd5c86}
.remove{background:#fce8f1;color:#ad5077;margin-top:10px}
footer{text-align:center;font-size:12px;color:#a17f90;margin-top:25px}
@media(max-width:500px){
 .grid{grid-template-columns:1fr}
 main{padding:19px}
 .tabs button{font-size:12px;padding:12px 5px}
}
</style>
</head>
<body>
<main>
<header>
 <div style="font-size:35px">🌸</div>
 <h1>Calculadora de Regra de Três</h1>
 <p>Seus cálculos de matemática de um jeito mais fácil ♡</p>
</header>

<div class="tabs">
 <button class="active" onclick="changeTab('simple',this)">Simples</button>
 <button onclick="changeTab('compound',this)">Composta</button>
</div>

<section id="simple" class="panel active">
 <h2>Regra de três simples</h2>
 <p>Insira os três valores conhecidos para descobrir o X.</p>

 <div class="grid">
  <div>
   <label>Valor A</label>
   <input type="number" id="a" placeholder="Ex: 4">
  </div>
  <div>
   <label>Valor B</label>
   <input type="number" id="b" placeholder="Ex: 12">
  </div>
  <div>
   <label>Valor C</label>
   <input type="number" id="c" placeholder="Ex: 6">
  </div>
  <div>
   <label>Tipo de proporcionalidade</label>
   <select id="type">
    <option value="direct">Direta</option>
    <option value="inverse">Inversa</option>
   </select>
  </div>
 </div>

 <button class="calculate" onclick="simple()">CALCULAR X</button>
 <button class="secondary" onclick="clearSimple()">LIMPAR</button>
 <div id="simpleResult" class="result"></div>
</section>

<section id="compound" class="panel">
 <h2>Regra de três composta</h2>
 <p>Informe o valor inicial de X e adicione as grandezas envolvidas.</p>

 <label>Valor inicial de X</label>
 <input type="number" id="base" placeholder="Ex: 6">

 <label>Unidade do resultado</label>
 <input id="unit" placeholder="Ex: dias">

 <div id="magnitudes"></div>

 <button class="secondary" onclick="addMagnitude()">+ ADICIONAR GRANDEZA</button>
 <button class="calculate" onclick="compound()">CALCULAR X</button>
 <button class="secondary" onclick="clearCompound()">LIMPAR</button>

 <div id="compoundResult" class="result"></div>
</section>

<footer>Calculadora de estudos ♡ Feita com carinho 🌷</footer>
</main>

<script>
function changeTab(id,button){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 button.classList.add('active');
}

function format(n){
 return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:8}).format(n);
}

function simple(){
 let a=Number(document.getElementById('a').value);
 let b=Number(document.getElementById('b').value);
 let c=Number(document.getElementById('c').value);
 let type=document.getElementById('type').value;
 let result=document.getElementById('simpleResult');

 if(!document.getElementById('a').value ||
    !document.getElementById('b').value ||
    !document.getElementById('c').value){
   result.style.display='block';
   result.innerHTML='Preencha todos os campos!';
   return;
 }

 if(a===0 || (type==='inverse' && c===0)){
   result.style.display='block';
   result.innerHTML='Não é possível dividir por zero.';
   return;
 }

 let x;
 let formula;

 if(type==='direct'){
   x=(b*c)/a;
   formula=`X = (${format(b)} × ${format(c)}) ÷ ${format(a)}`;
 }else{
   x=(a*b)/c;
   formula=`X = (${format(a)} × ${format(b)}) ÷ ${format(c)}`;
 }

 result.style.display='block';
 result.innerHTML=`
 <h3>Resultado:</h3>
 <strong>X = ${format(x)}</strong>
 <p><b>Resolução:</b></p>
 ${formula}
 <p>O resultado da regra de três é ${format(x)}.</p>`;
}

function clearSimple(){
 ['a','b','c'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('simpleResult').style.display='none';
 document.getElementById('type').value='direct';
}

let count=0;

function addMagnitude(){
 count++;
 let div=document.createElement('div');
 div.className='magnitude';
 div.innerHTML=`
 <h3>Grandeza ${count}</h3>
 <label>Nome da grandeza</label>
 <input class="name" placeholder="Ex: Trabalhadores">
 <div class="grid">
  <div>
   <label>Valor inicial</label>
   <input class="first" type="number" placeholder="Ex: 4">
  </div>
  <div>
   <label>Valor novo</label>
   <input class="second" type="number" placeholder="Ex: 6">
  </div>
 </div>
 <label>Proporcionalidade em relação a X</label>
 <select class="relation">
  <option value="direct">Direta</option>
  <option value="inverse">Inversa</option>
 </select>
 <button class="remove" onclick="this.parentElement.remove();renumber()">REMOVER</button>
 `;
 document.getElementById('magnitudes').appendChild(div);
}

function renumber(){
 document.querySelectorAll('.magnitude h3').forEach((h,i)=>{
 h.textContent='Grandeza '+(i+1);
 });
 count=document.querySelectorAll('.magnitude').length;
}

function compound(){
 let baseInput=document.getElementById('base');
 let base=Number(baseInput.value);
 let rows=document.querySelectorAll('.magnitude');
 let result=document.getElementById('compoundResult');

 if(!baseInput.value || base===0 || rows.length===0){
  result.style.display='block';
  result.innerHTML='Informe um valor inicial diferente de zero e adicione as grandezas.';
  return;
 }

 let x=base;
 let explanation=`Valor inicial de X = ${format(base)}\n\n`;

 for(let row of rows){
  let firstInput=row.querySelector('.first');
  let secondInput=row.querySelector('.second');
  let first=Number(firstInput.value);
  let second=Number(secondInput.value);
  let name=row.querySelector('.name').value || 'Grandeza';
  let relation=row.querySelector('.relation').value;

  if(!firstInput.value || !secondInput.value || first===0 ||
     (relation==='inverse' && second===0)){
   result.style.display='block';
   result.innerHTML=`Verifique os valores da grandeza: ${name}.`;
   return;
  }

  let factor;

  if(relation==='direct'){
   factor=second/first;
   explanation+=`${name}: ${format(second)} ÷ ${format(first)} (direta)\n`;
  }else{
   factor=first/second;
   explanation+=`${name}: ${format(first)} ÷ ${format(second)} (inversa)\n`;
  }

  x*=factor;
 }

 if(!Number.isFinite(x)){
  result.style.display='block';
  result.innerHTML='Não foi possível calcular.';
  return;
 }

 let unit=document.getElementById('unit').value;
 explanation+=`\nX = ${format(base)} × fatores de proporcionalidade\n`;
 explanation+=`Resultado: ${format(x)} ${unit}`;

 result.style.display='block';
 result.innerHTML=`
 <h3>Resultado:</h3>
 <strong>X = ${format(x)} ${unit}</strong>
 <p><b>Resolução passo a passo:</b></p>
 ${explanation}`;
}

function clearCompound(){
 document.getElementById('base').value='';
 document.getElementById('unit').value='';
 document.getElementById('magnitudes').innerHTML='';
 document.getElementById('compoundResult').style.display='none';
 count=0;
 addMagnitude();
 addMagnitude();
}

addMagnitude();
addMagnitude();
</script>
</body>
</html>
